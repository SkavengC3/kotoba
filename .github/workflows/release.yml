name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: linux-deb-rpm-appimage
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            label: windows-x64
            rust_target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            label: macos-universal
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        env:
          CI: true
        run: npx tauri build --ci ${{ matrix.args }}

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            ubuntu-22.04)
              cp src-tauri/target/release/bundle/deb/*.deb dist/
              cp src-tauri/target/release/bundle/rpm/*.rpm dist/
              cp src-tauri/target/release/bundle/appimage/*.AppImage dist/
              ;;
            windows-latest)
              cp src-tauri/target/release/bundle/msi/*.msi dist/
              cp src-tauri/target/release/bundle/nsis/*.exe dist/
              ;;
            macos-latest)
              cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
              ;;
          esac

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.label }}
          path: dist/*

  build-arch:
    name: Build (arch-linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine package version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PKGVER="${GITHUB_REF_NAME#v}"
          else
            PKGVER=$(node -p "require('./package.json').version")
          fi
          echo "pkgver=${PKGVER}" >> "${GITHUB_OUTPUT}"

      - name: Prepare Arch build sources
        run: |
          PKGVER="${{ steps.meta.outputs.pkgver }}"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" packaging/arch/PKGBUILD
          git archive --format=tar.gz --prefix="kotoba-${PKGVER}/" HEAD -o "packaging/arch/kotoba-${PKGVER}.tar.gz"

      - name: Build .pkg.tar.zst in Arch container
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" archlinux:base-devel bash -euxo pipefail -c '
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -Syu --noconfirm --needed \
              cairo gdk-pixbuf2 glib2 glibc gtk3 hicolor-icon-theme libsoup3 pango webkit2gtk-4.1 \
              git rust nodejs npm librsvg
            useradd -m builder
            mkdir -p /home/builder/build
            cp -a /work/packaging/arch/* /home/builder/build/
            chown -R builder:builder /home/builder/build
            su - builder -c "cd /home/builder/build && makepkg -f --noconfirm"
            mkdir -p /work/dist-arch
            cp /home/builder/build/*.pkg.tar.zst /work/dist-arch/
          '

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-arch
          path: dist-arch/*.pkg.tar.zst

  publish-release:
    name: Publish GitHub Release
    needs: [build-tauri, build-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: 言葉 Kotoba ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
